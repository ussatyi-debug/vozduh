name: Сборка офлайн APK Калькулятора

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Сборка автономного APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Java 21 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Установка Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Установка зависимостей проекта
        run: npm install

      - name: Сборка веб-приложения
        run: npm run build

      - name: Синхронизация ассетов в проект Android
        run: npx cap sync android

      - name: Принятие лицензий Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Права на выполнение gradlew
        run: chmod +x android/gradlew

      - name: Сборка Debug APK через Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Поиск и переименование готового APK
        run: |
          mkdir -p output_apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output_apk/Ventilation-Calculator-Offline.apk \;
          ls -la output_apk/

      - name: Загрузка готового APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Ventilation-Calculator-Offline-APK
          path: output_apk/Ventilation-Calculator-Offline.apk
          retention-days: 30
