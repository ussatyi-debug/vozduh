name: Сборка офлайн APK Калькулятора

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Сборка автономного APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci || npm install

      - name: Сборка веб-приложения
        run: npm run build

      - name: Синхронизация ассетов в проект Android
        run: npx cap sync android

      - name: Права на выполнение gradlew
        run: chmod +x android/gradlew

      - name: Сборка Debug APK через Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Поиск и переименование готового APK
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Ventilation-Calculator-Offline.apk
          ls -la output_apk/

      - name: Загрузка готового APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Ventilation-Calculator-Offline-APK
          path: output_apk/Ventilation-Calculator-Offline.apk
          retention-days: 30
